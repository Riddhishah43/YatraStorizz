<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Trips — YatraStorizz</title>
  <meta name="description" content="YatraStorizz trips: create, view, edit, and delete your travel plans." />
  <link rel="stylesheet" href="css/trips.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to trips</a>

  <nav class="top-nav" aria-label="Primary">
    <a class="top-nav__brand" href="../dashboard/dashboard.html">YatraStorizz</a>
    <div class="top-nav__links">
      <a href="../dashboard/dashboard.html">Dashboard</a>
      <a href="../discover/discover.html">Discover</a>
      <a href="trips.html" aria-current="page">Trips</a>
      <a href="../itinerary/trip-details.html">Itinerary</a>
      <a href="../budget/budget.html">Budget</a>
      <button type="button" class="btn btn--ghost btn--small" data-action="theme-toggle" aria-label="Toggle colour theme">◐ Theme</button>
    </div>
  </nav>

  <header class="trips-hero">
    <div class="trips-hero__text">
      <h1>My Trips</h1>
      <p>All your travel plans in one place — create new journeys, revisit upcoming escapes, and keep past adventures organized.</p>
    </div>
    <button type="button" class="btn btn--primary" data-action="create-trip">Create New Trip</button>
  </header>

  <div id="trips-stats" class="stat-chips" aria-label="Trip summary"></div>

  <div class="trips-controls">
    <div class="trips-controls__search">
      <label class="visually-hidden" for="trip-search">Search trips</label>
      <input type="search" id="trip-search" class="control" placeholder="Search by title, destination…" autocomplete="off" />
    </div>
    <label class="control-label">Status
      <select id="filter-status" class="control">
        <option value="all">All statuses</option>
        <option value="upcoming">Upcoming</option>
        <option value="ongoing">Ongoing</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </label>
    <label class="control-label">Sort by
      <select id="sort-by" class="control">
        <option value="startDate">Start date (earliest first)</option>
        <option value="createdAt">Recently created</option>
        <option value="title">Trip name (A–Z)</option>
      </select>
    </label>
    <p id="trips-count" class="trips-count" role="status" aria-live="polite"></p>
  </div>

  <div id="trips-status" class="status-region" role="status" aria-live="polite"></div>

  <main id="main" class="trips-main">
    <div id="trips-grid" class="trips-grid" aria-live="polite">
      <p class="empty-state">Loading trips…</p>
    </div>
  </main>

  <script type="module" src="js/trips.js"></script>
</body>
</html>
